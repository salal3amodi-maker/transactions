<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%2710%27 fill=%27%231d4fd7%27/%3E%3Cpath d=%27M8 25c3 6 8 9 12 9s9-3 12-9%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272.8%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M20 29V17%27 stroke=%27white%27 stroke-width=%272.6%27 stroke-linecap=%27round%27/%3E%3Cpath d=%27M20 20c-5.5 0-8.5-3-8.5-7.5C17 12.5 20 15 20 20z%27 fill=%27white%27/%3E%3Cpath d=%27M20 17c0-5.5 3-8.5 8.5-8.5C28.5 14 25.5 17 20 17z%27 fill=%27white%27/%3E%3C/svg%3E">
<title>نظام المعاملات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: شريط علوي + لوحة معلومات + قائمة معاملات + تفاصيل مع خط زمني، بتدرج أزرق محايد */
:root{
  --bg:#f2f5fa; --surface:#ffffff; --surface2:#f6f8fc; --ink:#15213b; --mut:#5a6885; --line:#dce3ef;
  --accent:#1d4fd7; --accent-ink:#ffffff; --accent-soft:#e5edfd;
  --good:#12765a; --good-soft:#dff3ea; --warn:#9a5700; --warn-soft:#fcefd6; --bad:#b0271f; --bad-soft:#fce7e5;
  --shadow:0 1px 2px rgba(21,33,59,.06),0 6px 20px rgba(21,33,59,.05);
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --font-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1322; --surface:#131c31; --surface2:#0f182b; --ink:#e7ecf8; --mut:#9aa8c7; --line:#243250;
  --accent:#6f9cff; --accent-ink:#0a1330; --accent-soft:#1a2a52;
  --good:#4cc39a; --good-soft:#12302a; --warn:#f0b45a; --warn-soft:#34270f; --bad:#ff8d84; --bad-soft:#3a1b1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1322; --surface:#131c31; --surface2:#0f182b; --ink:#e7ecf8; --mut:#9aa8c7; --line:#243250;
  --accent:#6f9cff; --accent-ink:#0a1330; --accent-soft:#1a2a52;
  --good:#4cc39a; --good-soft:#12302a; --warn:#f0b45a; --warn-soft:#34270f; --bad:#ff8d84; --bad-soft:#3a1b1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.4;text-wrap:balance}
h2{font-size:18px}h3{font-size:15px}
.shell{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card.flat{box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:5px 12px;font-size:13px}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
textarea{min-height:92px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:500}
label.f>input,label.f>select,label.f>textarea{color:var(--ink);font-size:15px}

.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.tag.new{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.esc{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.tag.urgent{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.high{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700}
.brand b{font-family:var(--font-display);font-size:17px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who select{width:auto;max-width:230px;padding:6px 10px;font-size:13px}
.bellwrap{position:relative}
.iconbtn{position:relative;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.badge{position:absolute;top:-5px;inset-inline-start:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.drop{position:absolute;top:44px;inset-inline-end:0;width:min(340px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20;overflow:hidden}
.drop .it{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:block;width:100%;text-align:start;background:none;border-inline:0;border-top:0}
.drop .it:hover{background:var(--surface2)}
.drop .it.unread{background:var(--accent-soft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;font-weight:600;color:var(--mut)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.3}
.tile .l{font-size:13px;color:var(--mut)}
.tile.alert .v{color:var(--bad)}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.qrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.qrow:last-child{border-bottom:0}
.qrow:hover .qt{color:var(--accent)}
.qt{font-weight:600}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.hbar{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hbar .track{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;display:flex;border:1px solid var(--line)}
.days{display:flex;gap:8px;align-items:flex-end;height:150px;padding-top:18px}
.day{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.day .bars{display:flex;gap:3px;align-items:flex-end;flex:1;width:100%;justify-content:center}
.day .b{width:42%;max-width:22px;border-radius:4px 4px 0 0;position:relative;min-height:2px}
.day .b span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mut)}
.day small{font-size:12px;color:var(--mut)}
.feed{display:flex;flex-direction:column;gap:8px}
.feed div{font-size:13.5px;padding-inline-start:12px;border-inline-start:2px solid var(--line)}

/* list */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
@media (max-width:720px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}
.item{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover .it-title{color:var(--accent)}
.it-title{font-weight:600;font-size:15.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty{padding:28px;text-align:center;color:var(--mut)}

/* detail */
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0;padding:12px;background:var(--surface2);border-radius:10px}
.meta div{display:flex;flex-direction:column;font-size:13px;color:var(--mut)}
.meta b{color:var(--ink);font-size:14.5px;font-weight:600}
.body-text{white-space:pre-wrap;margin:8px 0}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.file{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 10px;font-size:13px}
.file em{font-style:normal;font-weight:700;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 5px}
.tl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.tl li{position:relative;padding:0 22px 16px 0}
.tl li::before{content:"";position:absolute;right:5px;top:6px;bottom:-6px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;right:0;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.tl li.reply::after{background:var(--good)}
.tl li.escalate::after{background:var(--warn)}
.tl .q{background:var(--surface2);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:14px}
.ai{border:1px solid var(--accent);border-radius:12px;padding:14px;background:var(--accent-soft)}
.ai .box{background:var(--surface);border-radius:8px;padding:10px 12px;margin:8px 0;border:1px solid var(--line)}
.canned{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.canned:last-child{border-bottom:0}
.canned span{flex:1;min-width:220px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* login */
.login{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
@media (max-width:820px){.login{grid-template-columns:1fr}}
.pane{display:flex;flex-direction:column;gap:12px}
.demo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.demo button{text-align:start;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column}
.demo button:hover{border-color:var(--accent)}
.demo small{color:var(--mut)}
.feat{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.feat li{padding-inline-start:16px;position:relative}
.feat li::before{content:"";position:absolute;inset-inline-start:0;top:11px;width:6px;height:6px;border-radius:2px;background:var(--accent)}
/* ميزات جديدة */
.brief{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.brief h2{font-size:17px}
.brief .hl{font-family:var(--font-display);font-size:16.5px;font-weight:600;line-height:1.7}
.brief ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:3px}
.brief .acts{display:flex;gap:8px;flex-wrap:wrap}
.brief .act{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.brief .act:hover{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:3px 13px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ring{position:relative;width:70px;height:70px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;text-align:center;line-height:1.2;font-family:var(--font-display)}
.route{border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;background:var(--accent-soft);font-size:14px}
.lb{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.lb .track{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.lb .track i{display:block;height:100%;background:var(--accent)}
.logo svg{width:26px;height:26px;display:block}
.logo.big{width:64px;height:64px;border-radius:18px}
.logo.big svg{width:44px;height:44px}
.hero{gap:14px}
.hero h1{font-size:26px}
.footer{text-align:center;color:var(--mut);font-size:12.5px;padding:6px 0 2px}
.titlerow{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
#toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50}
#toast div{background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
</style>

<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>

<script>
document.documentElement.dir = "rtl";
document.documentElement.lang = "ar";

/* ---------- ثوابت ---------- */
const DEPTS = {fin: "المالية", hr: "الموارد البشرية", ads: "الإعلان"};
const LV = ["موظف", "مدير قسم", "المدير العام"];
const PRI = {urgent: {n: "عاجلة", h: 4}, high: {n: "مهمة", h: 24}, normal: {n: "عادية", h: 72}};
const ST = {new: "جديدة", esc: "محولة", done: "تم الرد"};
const H = 3600e3;
const ORG = {name: "جمعية أثر الخيرية", sub: "نظام المعاملات الداخلي"}; // اسم تجريبي، يُستبدل باسم الجمعية الفعلي
const LOGO = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 25c3 6 8 9 12 9s9-3 12-9" fill="none" stroke-width="2.8" stroke-linecap="round" style="stroke:var(--accent-ink)"/><path d="M20 29V17" fill="none" stroke-width="2.6" stroke-linecap="round" style="stroke:var(--accent-ink)"/><path d="M20 20c-5.5 0-8.5-3-8.5-7.5C17 12.5 20 15 20 20z" style="fill:var(--accent-ink)"/><path d="M20 17c0-5.5 3-8.5 8.5-8.5C28.5 14 25.5 17 20 17z" style="fill:var(--accent-ink)"/></svg>';
const MIN_SAVED = 8; // تقدير الدقائق الموفّرة لكل رد جاهز أو مقترح بالذكاء الاصطناعي

const USERS = [
  {email: "sara@co.com", name: "سارة", dept: "fin", level: 0},
  {email: "khaled@co.com", name: "خالد", dept: "hr", level: 0},
  {email: "noura@co.com", name: "نورة", dept: "ads", level: 0},
  {email: "fm@co.com", name: "مدير المالية", dept: "fin", level: 1},
  {email: "hm@co.com", name: "مدير الموارد البشرية", dept: "hr", level: 1},
  {email: "am@co.com", name: "مدير الإعلان", dept: "ads", level: 1},
  {email: "gm@co.com", name: "المدير العام", dept: null, level: 2},
];
const PASS = "1234";

const CANNED = {
  fin: [
    "تم استلام طلبكم، وجارٍ صرف المبلغ خلال 3 أيام عمل.",
    "نعتذر، الطلب غير مكتمل المستندات. نرجو إرفاق الفاتورة الأصلية.",
    "تمت الموافقة على الطلب وإحالته إلى الصرف.",
    "نعتذر، الطلب خارج الميزانية المعتمدة حاليًا."
  ],
  hr: [
    "تمت الموافقة على طلب الإجازة، نتمنى لك إجازة سعيدة.",
    "تم استلام طلبكم، وسيتم الرد خلال يومين عمل.",
    "نعتذر، رصيد الإجازات غير كافٍ لهذا الطلب.",
    "نرجو مراجعة الموارد البشرية لاستكمال الإجراءات."
  ],
  ads: [
    "تم استلام طلب الحملة، وسنرسل لكم الجدول الزمني قريبًا.",
    "نرجو تزويدنا بالمحتوى والشعار بدقة عالية لبدء التنفيذ.",
    "تمت الموافقة على التصميم، ويمكن البدء بالنشر.",
    "نعتذر، الموعد المطلوب غير متاح، ونقترح موعدًا بديلًا."
  ]
};

/* ---------- البيانات ---------- */
const KEY = "txsys-v4";
function seed() {
  const now = Date.now(); let id = 0, nid = 0;
  const txs = [], notifs = [];
  const mk = o => { id++; const t = Object.assign({id, ref: "م-" + (1000 + id), priority: "normal", level: 0, status: "new", attachments: [], log: []}, o); t.due = t.createdAt + PRI[t.priority].h * H; txs.push(t); return t; };
  const L = (t, at, by, role, action, text, kind) => t.log.push({at, by, role, action, text, kind});
  const N = (to, text, txId, at) => notifs.push({id: ++nid, to, text, txId, at, read: []});

  let t = mk({title: "طلب صرف مساعدة عاجلة لأسرة مستفيدة", body: "أرجو صرف مساعدة بمبلغ 3500 ريال لأسرة مستفيدة بعد اعتماد دراسة الحالة من الباحث الاجتماعي.", dept: "fin", from: "خالد", createdAt: now - 26 * H, attachments: [{name: "دراسة-الحالة.pdf", size: 182000}]});
  L(t, t.createdAt, "خالد", "موظف", "created", "تم إنشاء المعاملة"); N(["sara@co.com"], "معاملة جديدة: " + t.title, t.id, t.createdAt);

function plural(n, one, two, few, many) { if (n === 1) return one; if (n === 2) return two; if (n <= 10) return n + " " + few; return n + " " + many; }
function dur(ms) {
  const m = Math.max(1, Math.round(ms / 60000));
  if (m < 60) return plural(m, "دقيقة", "دقيقتين", "دقائق", "دقيقة");
  const h = Math.round(m / 60);
  if (h < 48) return plural(h, "ساعة", "ساعتين", "ساعات", "ساعة");

function ruleBrief(items) {
  const open = items.filter(t => t.status !== "done"), now = Date.now();
  const over = open.filter(t => t.due < now), urg = open.filter(t => t.priority === "urgent");
  const wait = open.filter(canAct).sort((a, b) => a.due - b.due);
  const dn = items.filter(t => t.doneAt), avg = dn.length ? dn.reduce((s, t) => s + (t.doneAt - t.createdAt), 0) / dn.length : 0;
  const byD = {}; open.forEach(t => { byD[t.dept] = (byD[t.dept] || 0) + 1; });
  const top = Object.keys(byD).sort((a, b) => byD[b] - byD[a])[0];
  const points = ["لديك " + wait.length + " معاملة بانتظار إجراءك من أصل " + open.length + " معاملة مفتوحة."];
  if (over.length) points.push(over.length + " منها متأخرة عن موعدها النهائي.");
  if (urg.length) points.push(urg.length + " معاملة عاجلة تحتاج متابعة.");
  if (top) points.push("أكثر قسم عليه ضغط: " + DEPTS[top] + " (" + byD[top] + " معاملة مفتوحة).");
  if (dn.length) points.push("متوسط زمن الرد على المعاملات المنتهية: " + dur(avg) + ".");
  const headline = over.length ? "يوجد " + over.length + " معاملة متأخرة وتحتاج انتباهًا اليوم." : open.length ? "الوضع تحت السيطرة، ولا توجد معاملات متأخرة." : "لا توجد معاملات مفتوحة.";
  return {headline, points: points.slice(0, 4), actions: wait.slice(0, 3).map(t => ({id: t.id, text: t.title})), mode: "sim", at: now};
}

    sel("fDept", [["all", "كل الأقسام"], ["fin", "المالية"], ["hr", "الموارد البشرية"], ["ads", "الإعلان"]]) +
    sel("fPri", [["all", "كل الأولويات"], ["urgent", "عاجلة"], ["high", "مهمة"], ["normal", "عادية"]]) +
    '</div><div id="listBody" style="margin-top:8px">' + listBody() + "</div></div>";
}

function newView() {
  const d = V.nd;
  return '<div class="card"><h2>معاملة جديدة</h2><div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">' +
    '<label class="f">عنوان المعاملة<input id="nt" data-in="nd.title" value="' + esc(d.title) + '"></label>' +
    '<label class="f">التفاصيل<textarea id="nb" data-in="nd.body">' + esc(d.body) + "</textarea></label>" +
    '<div class="row"><button class="btn ghost" data-a="route"' + (V.routeBusy ? " disabled" : "") + ">" + (V.routeBusy ? '<span class="spin"></span>' : "") + 'صنّف بالذكاء الاصطناعي</button><span class="mut small">يحدد القسم والأولوية من نص المعاملة</span></div>' +
    (V.route ? '<div class="route"><b>تم التصنيف:</b> ' + DEPTS[V.route.dept] + " · " + PRI[V.route.pri].n + " — " + esc(V.route.why) + ' <span class="tag">' + (V.route.mode === "claude" ? "Claude" : "وضع المحاكاة") + "</span></div>" : "") +
    '<div class="grid2"><label class="f">القسم المختص<select data-change="nd.dept">' + Object.keys(DEPTS).map(k => '<option value="' + k + '"' + (d.dept === k ? " selected" : "") + ">" + DEPTS[k] + "</option>").join("") + "</select></label>" +
    '<label class="f">الأولوية<select data-change="nd.pri">' + Object.keys(PRI).map(k => '<option value="' + k + '"' + (d.pri === k ? " selected" : "") + ">" + PRI[k].n + " (الرد خلال " + PRI[k].h + " ساعة)</option>").join("") + "</select></label></div>" +
    '<label class="f">المرفقات<input type="file" id="nf" multiple data-change="files"></label>' +
    (d.files.length ? '<div class="files">' + d.files.map((f, i) => '<span class="file"><em>' + ext(f.name) + "</em>" + esc(f.name) + ' <span class="mut">' + fsize(f.size) + '</span><button class="btn ghost sm" data-a="rmfile" data-i="' + i + '" aria-label="حذف المرفق">×</button></span>').join("") + "</div>" : "") +
    (V.err ? '<div class="tag bad">' + esc(V.err) + "</div>" : "") +
    '<div class="row"><button class="btn" data-a="addtx">إرسال المعاملة</button><button class="btn ghost" data-a="tab" data-tab="list">إلغاء</button></div></div></div>';
}

function detailView(t) {
  const act = canAct(t), ai = V.ai[t.id + ":" + t.level], di = dueInfo(t);
  const log = t.log.map(l => '<li class="' + l.action + '"><div><b>' + esc(l.by) + '</b> <span class="mut small">' + esc(l.role) + " · " + fdate(l.at) + "</span> " +
    (l.action === "created" ? "" : l.action === "escalate" ? '<span class="tag esc">تحويل</span>' : '<span class="tag done">' + esc(l.kind || "رد") + "</span>") + "</div>" +
    (l.action === "created" ? '<div class="mut small">أنشأ المعاملة</div>' : '<div class="q">' + esc(l.text) + "</div>") + "</li>").join("");
  let aiBox = "";
  if (act) {
    if (V.aiBusy) aiBox = '<div class="ai"><span class="spin"></span>جارٍ تحليل المعاملة...</div>';
    else if (ai) aiBox = '<div class="ai"><div class="row" style="justify-content:space-between"><b>تحليل الذكاء الاصطناعي</b><span class="tag">' + (ai.mode === "claude" ? "Claude" : "وضع المحاكاة") + "</span></div>" +
      '<div class="box"><div class="mut small">الملخص</div>' + esc(ai.summary) + "</div>" +
      '<div class="box"><div class="mut small">التوصية</div><b>' + (ai.decision === "escalate" ? "تحويل للإدارة الأعلى" : "الرد مباشرة") + "</b> · " + esc(ai.reason) + "</div>" +
      '<div class="box"><div class="mut small">الرد المقترح</div>' + esc(ai.reply) + "</div>" +
      '<div class="row"><button class="btn good" data-a="aireply">إرسال هذا الرد</button>' + (ai.decision === "escalate" && me.level < 2 ? '<button class="btn warn" data-a="escalate">تحويل للأعلى</button>' : "") +
      '<button class="btn ghost" data-a="aiedit">تعديل قبل الإرسال</button><button class="btn ghost" data-a="airun">إعادة التحليل</button></div></div>';
    else aiBox = '<div class="ai"><div class="row" style="justify-content:space-between"><div><b>المساعد الذكي</b><div class="mut small">يلخّص المعاملة، ويقترح رد، ويوصي بالرد أو التحويل.</div></div><button class="btn" data-a="airun">حلّل المعاملة</button></div></div>';
  }
  const actions = act ? '<div class="card">' + aiBox +
    '<h3 style="margin-top:18px">ردود جاهزة (ضغطة واحدة)</h3>' + CANNED[t.dept].map((c, i) => '<div class="canned"><span>' + esc(c) + '</span><button class="btn sm" data-a="canned" data-i="' + i + '">إرسال</button></div>').join("") +
    '<h3 style="margin-top:18px">رد مخصص</h3><textarea id="cr" data-in="draft" placeholder="اكتب ردك هنا">' + esc(V.draft) + "</textarea>" +
    (V.hasSample ? '<div class="chips" style="margin-top:8px"><span class="mut small">نبرة الصياغة:</span>' + ["رسمي", "مختصر", "ودّي"].map(x => '<button class="chip" data-a="tone" data-t="' + x + '" aria-pressed="' + (V.tone === x) + '">' + x + "</button>").join("") + "</div>" : "") +
    '<div class="row" style="margin-top:8px"><button class="btn good" data-a="custom">إرسال الرد</button>' + (V.hasSample ? '<button class="btn ghost" data-a="polish"' + (V.polishBusy ? " disabled" : "") + ">" + (V.polishBusy ? '<span class="spin"></span>' : "") + "حسّن الصياغة</button>" : "") + "</div>" +
    (me.level < 2 ? '<h3 style="margin-top:18px">تحويل للإدارة الأعلى</h3><textarea id="nt2" data-in="note" placeholder="ملاحظة للمستوى الأعلى (اختياري)" style="min-height:64px">' + esc(V.note) + '</textarea><div style="margin-top:8px"><button class="btn warn" data-a="escalate">تحويل إلى ' + LV[t.level + 1] + "</button></div>" : "") + "</div>" : "";
  return '<div class="card"><button class="btn ghost sm" data-a="tab" data-tab="list">رجوع للمعاملات</button>' +
    '<div class="titlerow"><div class="grow"><h2>' + esc(t.title) + '</h2><div class="tags" style="margin-top:8px">' + tags(t) + "</div></div>" + ringHtml(t) + "</div>" +
    '<div class="meta"><div>رقم المعاملة<b>' + t.ref + "</b></div><div>القسم<b>" + DEPTS[t.dept] + "</b></div><div>من<b>" + esc(t.from) + "</b></div><div>تاريخ الإنشاء<b>" + fdate(t.createdAt) + "</b></div><div>الموعد النهائي<b>" + fdate(t.due) + "</b></div><div>عند<b>" + LV[t.level] + "</b></div></div>" +
    '<div class="body-text">' + esc(t.body) + "</div>" +
    (t.attachments.length ? '<div class="files">' + t.attachments.map(f => '<span class="file"><em>' + ext(f.name) + "</em>" + esc(f.name) + ' <span class="mut">' + fsize(f.size) + "</span></span>").join("") + "</div>" : "") + "</div>" +
    actions + '<div class="card"><h2>سجل التتبع</h2><ul class="tl" style="margin-top:12px">' + log + "</ul></div>";
}

/* ---------- الأحداث ---------- */
function setField(k, v) { if (k.indexOf("nd.") === 0) V.nd[k.slice(3)] = v; else V[k] = v; }
function doLogin(email) {
  const u = USERS.find(x => x.email === email); if (!u) return;
  me = u; V.brief = null; V.route = null; V.tab = "dash"; V.id = null; V.err = ""; V.bell = false; V.draft = ""; V.note = ""; V.nd.dept = u.dept || "fin"; render(); window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const inBell = e.target.closest(".bellwrap");
  if (V.bell && !inBell && me) { V.bell = false; render(); }
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, id = Number(el.dataset.id);
  if (a === "login") doLogin(el.dataset.email);
  else if (a === "loginform") {
    const em = (Q("#em").value || "").trim().toLowerCase(), pw = Q("#pw").value;
    if (USERS.some(u => u.email === em) && pw === PASS) doLogin(em); else { V.err = "البريد أو كلمة المرور غير صحيحة."; render(); }
  }
  else if (a === "logout") { me = null; V.err = ""; render(); }
  else if (a === "reset") { if (!V.resetArm) { V.resetArm = true; render(); } else { S = seed(); save(); V.resetArm = false; V.ai = {}; toast("أُعيد ضبط بيانات العرض"); render(); } }
  else if (a === "tab") { V.tab = el.dataset.tab; V.bell = false; V.err = ""; render(); window.scrollTo(0, 0); }
  else if (a === "open") { V.id = id; V.tab = "detail"; V.draft = ""; V.note = ""; render(); window.scrollTo(0, 0); }
  else if (a === "bell") { V.bell = !V.bell; render(); }
  else if (a === "opennotif") { const n = S.notifs.find(x => x.id === Number(el.dataset.nid)); if (n && !n.read.includes(me.email)) n.read.push(me.email); save(); V.bell = false; if (tx(id) && visible(tx(id))) { V.id = id; V.tab = "detail"; } render(); window.scrollTo(0, 0); }
  else if (a === "canned") doReply(V.id, CANNED[tx(V.id).dept][Number(el.dataset.i)], "رد جاهز");
  else if (a === "custom") doReply(V.id, V.draft, "رد مخصص");
  else if (a === "escalate") doEscalate(V.id);
  else if (a === "airun") runAI(V.id);
  else if (a === "aireply") { const t = tx(V.id), r = V.ai[t.id + ":" + t.level]; if (r) doReply(t.id, r.reply, "ذكاء اصطناعي"); }
  else if (a === "aiedit") { const t = tx(V.id), r = V.ai[t.id + ":" + t.level]; if (r) { V.draft = r.reply; render(); const c = Q("#cr"); if (c) c.focus(); } }
  else if (a === "polish") polish();
  else if (a === "brief") runBrief();
  else if (a === "export") exportCsv();
  else if (a === "sim") simulate();
  else if (a === "route") runRoute();
  else if (a === "tone") { V.tone = el.dataset.t; render(); }
  else if (a === "addtx") addTx();
  else if (a === "rmfile") { V.nd.files.splice(Number(el.dataset.i), 1); render(); }
});
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  setField(k, e.target.value);
  if (k === "q") Q("#listBody").innerHTML = listBody();
});
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.change; if (!k) return;
  if (k === "switch") { doLogin(e.target.value); return; }
  if (k === "files") { Array.from(e.target.files || []).forEach(f => V.nd.files.push({name: f.name, size: f.size})); render(); return; }
  setField(k, e.target.value); render();
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && !me && e.target.tagName === "INPUT") { e.preventDefault(); const b = Q('[data-a="loginform"]'); if (b) b.click(); } });

render();
getSample().then(s => { V.hasSample = !!s; if (me) render(); });
(async () => { try { const d = window.claude && window.claude.use ? await window.claude.use("downloads") : null; V.hasDl = !!d; if (me) render(); } catch (e) {} })();
</script>

</body>
